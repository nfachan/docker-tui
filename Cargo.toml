[package]
name = "docker-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
bollard = "0.18"
clap = { version = "4", features = ["derive", "wrap_help"] }
color-eyre = "0.6"
crossterm = "0.29"
itertools = "0.14"
derive_more = { version = "2", features = ["debug", "display"] }
ratatui = "0.29"
timeago = "0.5"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
rstest = "0.26"
